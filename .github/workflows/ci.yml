name: Product verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
  supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npx supabase start --exclude studio,imgproxy,logflare,vector,edge-runtime
      - name: Migration smoke against real Supabase
        run: npx supabase db reset --local --no-seed
      - run: node scripts/ci-environment.mjs
      - name: Prepare real Auth fixtures
        run: npx tsx tests/e2e/setup.ts
      - name: Restore drill with real local Supabase
        run: npx tsx tests/recovery/local-supabase.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            playwright-report/
            docs/verification/restore-local.json
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
