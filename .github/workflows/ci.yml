name: Product verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run test:hardening
      - run: npm run test:load
      - name: Explain and measure unchanged critical SQL on the initial schema
        run: SQL_BASELINE=1 npx tsx tests/load/critical.ts
      - name: Explain and measure critical SQL on the candidate schema
        run: npx tsx tests/load/critical.ts
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sql-and-load-verification
          path: |
            docs/verification/definitive/sql-*.json
            docs/verification/load-results.json
          retention-days: 90
  supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npx supabase start --exclude studio,imgproxy,logflare,vector,edge-runtime
      - name: Migration smoke against real Supabase
        run: npx supabase db reset --local --no-seed
      - run: node scripts/ci-environment.mjs
      - name: Upgrade existing 27-migration ledger without rewriting history
        run: npx tsx tests/recovery/upgrade-local.ts
      - name: Prepare real Auth fixtures
        run: npx tsx tests/e2e/setup.ts
      - name: Restore drill with real local Supabase
        run: npx tsx tests/recovery/local-supabase.ts
      - name: Install Chromium and verify host libraries
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(browser => browser.close())"; then
            npx playwright install-deps chromium
          fi
      - run: npm run build
        id: product-build
      - run: npm run test:e2e
      - name: Capture redesigned product with real Auth
        if: ${{ !cancelled() && steps.product-build.outcome == 'success' }}
        run: |
          npx tsx scripts/prepare-ux-fixtures.ts
          npm start > .test-data/redesign-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break || sleep 1; done
          node scripts/capture-product.mjs
      - name: Measure isolated HTTP and browser candidate
        run: QA_PHASE=after node scripts/measure-product.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b7d5cfd42611d83347b4307e0c53db173d7b967f
          path: .test-data/performance-before
          persist-credentials: false
      - name: Build exact initial product for comparison on the same isolated runner
        run: |
          cp .env.local .test-data/performance-before/.env.local
          cd .test-data/performance-before
          npm ci
          npm run build
      - name: Measure exact initial product against the same isolated data
        run: QA_SERVER_DIR=.test-data/performance-before QA_PHASE=before node scripts/measure-server.mjs
      - name: Build dedicated React profiling variant
        run: NEXT_PUBLIC_QA_PROFILE=1 npm run build -- --profile
      - name: Record React commits separately from ordinary production timings
        run: QA_SERVER_PORT=3002 QA_PHASE=profiling node scripts/measure-server.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            playwright-report/
            docs/verification/restore-local.json
            docs/verification/migration-upgrade.json
            docs/verification/ux/after/
            docs/verification/definitive/
          retention-days: 90
      - if: always()
        run: npx supabase stop --no-backup
  visual-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b7d5cfd42611d83347b4307e0c53db173d7b967f
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .test-data/audit-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.15.0"
          cache: npm
      - run: |
          cp .test-data/audit-tools/package.json package.json
          cp .test-data/audit-tools/package-lock.json package-lock.json
          cp .test-data/audit-tools/scripts/capture-product.mjs scripts/capture-product.mjs
          cp .test-data/audit-tools/scripts/prepare-ux-fixtures.ts scripts/prepare-ux-fixtures.ts
          rm -rf .test-data/audit-tools
      - run: npm ci
      - run: npx supabase start --exclude studio,imgproxy,logflare,vector,edge-runtime
      - run: npx supabase db reset --local --no-seed
      - run: node scripts/ci-environment.mjs
      - run: npx tsx tests/e2e/setup.ts
      - name: Install Chromium and verify host libraries
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(browser => browser.close())"; then
            npx playwright install-deps chromium
          fi
      - run: npm run build
      - name: Capture recovered PR UI with actual isolated Auth
        run: |
          npx tsx scripts/prepare-ux-fixtures.ts
          npm start > .test-data/baseline-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://localhost:3000/api/health && break || sleep 1; done
          QA_PHASE=before node scripts/capture-product.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: visual-baseline
          path: docs/verification/ux/before/
          retention-days: 90
      - if: always()
        run: npx supabase stop --no-backup
